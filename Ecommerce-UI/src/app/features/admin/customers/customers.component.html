<div class="page-header">
  <h1 class="page-title">Customer Management</h1>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Dashboard</a></li>
      <li class="breadcrumb-item active">Customers</li>
    </ol>
  </nav>
</div>

<div class="card">
  <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div class="d-flex align-items-center gap-1">
      <h6 class="fw-semibold mb-0"><i class="bi bi-person-check me-2 text-primary"></i>All Customers</h6>
      <span class="badge bg-primary-subtle text-primary rounded-pill ms-1">{{ total }}</span>
    </div>
  </div>
  <div class="card-body p-0">
    <app-data-table [columns]="columns" [data]="tableData" [loading]="loading"
      (actionClick)="onAction($event)">
    </app-data-table>
  </div>
  <div class="card-footer bg-white d-flex align-items-center justify-content-between flex-wrap gap-2 py-3">
    <span class="text-muted small">Showing {{ customers.length }} of {{ total }} customers</span>
    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
  </div>
</div>

<app-confirmation-dialog [visible]="confirmDialog.visible" [title]="confirmDialog.title"
  [message]="confirmDialog.message"
  [confirmLabel]="confirmDialog.action === 'delete' ? 'Delete' : 'Confirm'"
  [confirmBtnClass]="confirmDialog.action === 'delete' ? 'btn-danger' : 'btn-primary'"
  (confirmed)="confirmAction()" (cancelled)="confirmDialog.visible = false">
</app-confirmation-dialog>
